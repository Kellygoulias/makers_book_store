

<nav><a href = "/"><button>Home</button></a> || <a href = "/hello"><button>Welcome</button></a> || <a href = "/authors"><button>authors</button></a> || <a href = "/books"><button>Books</button></a> ||</nav>

<head>
    <link rel="stylesheet" href="/static/styles.css">
    <h1>Books</h1>
</head>

<main>
    <h2>Here are some books:</h2>
        <ul>
            {% for book in books %}
                <li>{{ book.title }} by {{book.author}}</li>
            {% endfor %}
        </ul>
        <form method="POST" action="/books">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Title"><br>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" placeholder="Author"><br>

            <input type="submit" value="Submit">
        </form>
</main>
