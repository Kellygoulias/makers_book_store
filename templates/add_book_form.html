<head>
    <link rel="stylesheet" href="/static/styles.css">
    <h1>Books</h1>

<main>
    <div>
    <h2>Please add your book:</h2>
        <form method="POST" action="/books">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Title"><br>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" placeholder="Author"><br>

            <label for="synopsis">Synopsis</label>
            <input type="text" id="synopsis" name="synopsis" placeholder="Synopsis"><br>

            <label for="rating">Rating</label>
            <input type="number" min="0" max="10" id="rating" name="rating" placeholder="Rating"><br>

            <label for="notes">Notes</label>
            <input type="text" id="notes" name="notes" placeholder="Notes"><br>

            <input type="submit" value="Submit"><input type="reset" value="Reset">
        </form>
    </div>
</main>
